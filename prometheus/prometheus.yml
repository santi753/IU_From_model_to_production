# Prometheus configuration for fraud detection API
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: []

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# A scrape configuration containing exactly one endpoint to scrape:
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'fraud-detection-api'
    
    # Override the global default and scrape targets from this job every 10 seconds.
    scrape_interval: 10s
    
    # Metrics path defaults to '/metrics'
    metrics_path: /metrics
    
    # Scheme defaults to 'http'.
    scheme: http
    
    static_configs:
      # Use container name for Docker Compose, fallback to localhost for local development
      - targets: ['api:8000', 'localhost:8000']
        labels:
          service: 'fraud-detection'
          environment: 'development'

  # Self-monitoring: Prometheus scrapes its own metrics
  - job_name: 'prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'