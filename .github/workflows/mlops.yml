name: MLOps Pipeline

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      run_demo:
        description: 'Run full 12-month demonstration'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout repository (no LFS)
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Set API key
        run: echo "API_KEY=dev-key" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Docker & Compose
        run: |
          docker --version
          docker compose version

      # ---- Fetch data from Kaggle (uses repo secrets) ----
      - name: Fetch dataset from Kaggle
        run: |
          if [ -f data/data_raw.csv ]; then
            echo "data/data_raw.csv already exists — skipping Kaggle download."
            exit 0
          fi

          python -m pip install --upgrade pip
          pip install kaggle

          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}' "${{ secrets.KAGGLE_USERNAME }}" "${{ secrets.KAGGLE_KEY }}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

          mkdir -p data/kaggle
          kaggle datasets download -d divyaraj2006/credit-card-fraud-detection -p data/kaggle --unzip
          echo "Downloaded files:"; ls -R data/kaggle

          # If your training code expects a specific filename, adjust this copy.
          CSV_FILE=$(ls data/kaggle/*.csv | head -n 1)
          if [ -z "$CSV_FILE" ]; then
            echo "No CSV found in dataset."
            exit 1
          fi
          mkdir -p data
          cp "$CSV_FILE" data/data_raw.csv
          echo "Using $(basename "$CSV_FILE") -> data/data_raw.csv"

      - name: Build & start services
        run: docker compose -f docker-compose.yml up -d --build

      - name: Wait for API to be ready
        run: |
          echo "⏳ Waiting for API (http://localhost:8000/health) ..."
          for i in {1..40}; do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 3
          done
          echo "API did not become ready in time. Dumping logs:"
          docker compose logs api || true
          exit 1

      - name: 🧪 Test API predictions
        run: |
          echo "🧪 Testing API predictions..."
          curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"amount": 123.45}' | tee /tmp/predict.json

      - name: Upload artifacts (logs/MLflow)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_number }}-artifacts
          path: |
            mlruns/
            *.log
            /tmp/predict.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Show service logs (always)
        if: always()
        run: docker compose logs --no-color > docker-compose.logs || true

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-${{ github.run_number }}
          path: docker-compose.logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up services
        if: always()
        run: |
          echo "🧹 Cleaning up services..."
          docker compose down -v --remove-orphans || true
